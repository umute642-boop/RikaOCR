[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rikaocr"
version = "0.1.0"
description = "Open-source HTR/OCR system for Ottoman Rik'a (BOA) documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Umut" }]
keywords = ["ocr", "htr", "ottoman", "rika", "paleography", "arabic-script"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
]
# M0 has NO runtime dependencies. Heavy libraries (torch, etc.) will be added
# later as optional extras (see TDD v0.2 / Roadmap M5).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
# train = [...]  # Added in M5: torch and recognition stack.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
namespace_packages = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
